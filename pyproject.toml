[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entertainment-concierge-agent"
version = "0.1.0"
description = "Bounded corporate-entertainment concierge agent: one-sentence request to a confirmed, paid, on-policy booking proposal, with a deterministic guardrail and human gates."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
